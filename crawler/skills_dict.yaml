# canonical skill -> regex aliases (case-insensitive). Used by extract.py (no LLM).
# 추가/수정은 자유롭게. 그룹은 stats 출력에서 묶음 단위로 쓰인다.
language:
  Node.js: ['node\.?js', '\bnode\b', '노드']
  TypeScript: ['typescript', '\bts\b', '타입스크립트']
  JavaScript: ['javascript', '\bjs\b', '자바스크립트']
  Java: ['\bjava\b(?!script)', '자바(?!스크립트)']
  Kotlin: ['kotlin', '코틀린']
  Python: ['python', '파이썬']
  Go: ['golang', '\bgo\b(?:\s*언어|lang)?', 'go언어']
  C++: ['c\+\+']
  Rust: ['\brust\b']
  PHP: ['\bphp\b']
framework:
  NestJS: ['nest\.?js', '\bnest\b']
  Express: ['express']
  Spring: ['spring', '스프링']
  Django: ['django']
  FastAPI: ['fastapi']
  GraphQL: ['graphql']
  React: ['react(?!\s*native)']
  Next.js: ['next\.?js']
orm_db:
  MySQL: ['mysql']
  PostgreSQL: ['postgres', 'postgresql']
  Oracle: ['oracle']
  MongoDB: ['mongo']
  Redis: ['redis', '레디스']
  Elasticsearch: ['elastic\s*search', '\bes\b(?=.*검색)']
  DynamoDB: ['dynamo']
  TypeORM: ['typeorm']
  Prisma: ['prisma']
  JPA: ['\bjpa\b', 'hibernate']
  RDBMS: ['rdbms', '관계형\s*데이터베이스']
  NoSQL: ['nosql']
infra:
  AWS: ['\baws\b', 'amazon web services', '아마존 웹']
  GCP: ['\bgcp\b', 'google cloud']
  Azure: ['azure']
  Docker: ['docker', '도커', '컨테이너']
  Kubernetes: ['kubernetes', '\bk8s\b', '쿠버네티스']
  Terraform: ['terraform']
  CI/CD: ['ci\s*/\s*cd', 'github actions', 'jenkins', 'argo\s*cd', '배포\s*자동화']
  Linux: ['linux', '리눅스']
  Nginx: ['nginx']
  Serverless: ['lambda', 'serverless', '서버리스']
messaging:
  Kafka: ['kafka', '카프카']
  RabbitMQ: ['rabbitmq']
  SQS/SNS: ['\bsqs\b', '\bsns\b']
  Message Queue: ['message\s*queue', '메시지\s*큐', '\bmq\b']
practice:
  Testing: ['테스트\s*코드', '단위\s*테스트', 'unit\s*test', '\btdd\b', 'jest', 'e2e', '테스트\s*자동화']
  TDD: ['\btdd\b', '테스트\s*주도']
  DDD: ['\bddd\b', '도메인\s*주도']
  MSA: ['\bmsa\b', '마이크로\s*서비스', 'microservice']
  Event-Driven: ['이벤트\s*기반', 'event[\s-]*driven', '이벤트\s*드리븐']
  Clean Architecture: ['클린\s*아키텍처', 'clean\s*architecture', '헥사고날', 'hexagonal']
  Design Pattern: ['디자인\s*패턴', 'design\s*pattern', '객체\s*지향', '\boop\b']
  Code Review: ['코드\s*리뷰', 'code\s*review']
  REST API: ['rest\s*(?:ful)?\s*api', 'restful']
  gRPC: ['grpc']
topic:
  대용량 트래픽: ['대용량', '대규모\s*트래픽', '고트래픽', 'high\s*traffic', '트래픽']
  성능 최적화: ['성능\s*(?:개선|최적화|튜닝)', 'performance']
  쿼리 튜닝: ['쿼리\s*(?:튜닝|최적화)', 'sql\s*튜닝', '인덱스', '실행\s*계획', 'slow\s*query']
  동시성: ['동시성', 'concurrency', '분산\s*락', 'distributed\s*lock', '트랜잭션']
  모니터링/APM: ['모니터링', '\bapm\b', 'datadog', 'grafana', 'prometheus', 'sentry', 'new\s*relic']
  장애 대응: ['장애', 'incident', '온콜', 'on-?call']
  데이터 모델링: ['데이터\s*모델링', '스키마\s*설계', 'erd', 'db\s*설계']
  보안: ['보안', 'security', '인증', 'oauth', 'jwt']
  결제/핀테크: ['결제', '정산', '핀테크', 'fintech', 'pg사']
  AI/LLM: ['\bllm\b', '\bai\b', '인공지능', 'gpt', 'rag', '에이전트']
  알고리즘/CS: ['자료\s*구조', '알고리즘', '컴퓨터\s*공학', 'cs\s*지식', '운영\s*체제', '네트워크']
  오픈소스: ['오픈\s*소스', 'open\s*source']
  기술 블로그/공유: ['기술\s*블로그', '발표', '기술\s*공유', '컨퍼런스']
soft:
  협업/커뮤니케이션: ['커뮤니케이션', '협업', '소통']
  문서화: ['문서화', 'documentation']
  주도성: ['주도적', '오너십', 'ownership', '자기\s*주도']
  스타트업 경험: ['스타트업', '초기\s*멤버', '0\s*to\s*1', '제로\s*투\s*원']
